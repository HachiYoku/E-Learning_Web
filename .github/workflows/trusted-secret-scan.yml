name: Trusted secret scan

on:
  pull_request_target:
    branches: [testing-environment, main]

permissions:
  contents: read

jobs:
  trusted-gitleaks:
    runs-on: ubuntu-22.04
    steps:
      # The workflow definition comes from the default branch. Check out the
      # PR's base commit so scripts and rules are not supplied by the PR head.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
      - name: Scan proposed commits with trusted rules
        env:
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          EVENT_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/secret-scan-ci.sh
