name: Security and builds

on:
  pull_request:
    branches:
      - testing-environment
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-security:
    name: Backend security tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: apps/Backend/package-lock.json

      # The auth integration suite starts its own temporary mongod process.
      # This action installs mongod on the runner; it never connects to a
      # production database or other production service.
      - name: Provision local MongoDB executable
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: 8.0

      - name: Verify mongod is available
        run: mongod --version

      - name: Install backend dependencies
        working-directory: apps/Backend
        run: npm ci

      - name: Run authentication and private-payment-proof security tests
        working-directory: apps/Backend
        run: npm run test:auth-security

      - name: Run trusted URL security tests
        working-directory: apps/Backend
        run: npm run test:trusted-url-security

      - name: Run XSS security tests
        working-directory: apps/Backend
        run: npm run test:xss-security

      - name: Run notification-link security tests
        working-directory: apps/Backend
        run: npm run test:notification-link-security

  student-build:
    name: Student frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: apps/Frontend/package-lock.json

      - name: Install student frontend dependencies
        working-directory: apps/Frontend
        run: npm ci

      - name: Build student frontend
        working-directory: apps/Frontend
        run: npm run build

  admin-build:
    name: Admin frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: apps/Admin/package-lock.json

      - name: Install admin frontend dependencies
        working-directory: apps/Admin
        run: npm ci

      - name: Build admin frontend
        working-directory: apps/Admin
        run: npm run build

  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: |
            apps/Backend/package-lock.json
            apps/Frontend/package-lock.json
            apps/Admin/package-lock.json

      - name: Install backend production dependencies
        working-directory: apps/Backend
        run: npm ci --omit=dev

      - name: Audit backend production dependencies
        working-directory: apps/Backend
        run: npm audit --omit=dev --audit-level=high

      - name: Install student frontend production dependencies
        working-directory: apps/Frontend
        run: npm ci --omit=dev

      - name: Audit student frontend production dependencies
        working-directory: apps/Frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Install admin frontend production dependencies
        working-directory: apps/Admin
        run: npm ci --omit=dev

      - name: Audit admin frontend production dependencies
        working-directory: apps/Admin
        run: npm audit --omit=dev --audit-level=high
